name: Repository CI

on:
  pull_request:
    paths:
      - "tools/pac-cel/**"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/sync-branches-tests.yml"
      - ".github/workflows/main-release-feasibility.yml"
  push:
    branches:
      - main
    paths:
      - "tools/pac-cel/**"
      - "lib/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/sync-branches-tests.yml"
      - ".github/workflows/main-release-feasibility.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: tools/pac-cel/go.mod
          cache-dependency-path: tools/pac-cel/go.sum

      - name: Test and vet CEL helper
        working-directory: tools/pac-cel
        env:
          GOTOOLCHAIN: local
        run: |
          go test ./...
          go vet ./...

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit and e2e tests
        run: pytest -v --cov=lib --cov=scripts --cov-report=term-missing
