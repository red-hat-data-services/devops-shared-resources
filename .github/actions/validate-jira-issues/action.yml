name: 'Validate Jira Issues'
description: 'Validates that Jira issues referenced in a PR meet post-codefreeze criteria'

inputs:
  pr_body:
    description: 'Pull request body/description text'
    required: true
  jira_version:
    description: 'Expected Jira version string (e.g., "2.6 GA RHOAI RELEASE")'
    required: true
  jira_base_url:
    description: 'Jira instance base URL'
    required: true
  jira_user_email:
    description: 'Email of the Atlassian account that owns the API token'
    required: true
  jira_api_token:
    description: 'Atlassian API token for Jira REST API (Basic Auth)'
    required: true
  release_blocker_field_id:
    description: 'Custom field ID for "Release Blocker" (e.g., customfield_12345)'
    required: true
outputs:
  pass:
    description: '"true" if all checks passed, "false" otherwise'
    value: ${{ steps.validate.outputs.pass }}
  errors:
    description: 'Multiline markdown of all validation failures'
    value: ${{ steps.validate.outputs.errors }}
  details:
    description: 'Multiline markdown of passed checks'
    value: ${{ steps.validate.outputs.details }}

runs:
  using: 'composite'
  steps:
    - name: Validate Jira issues
      id: validate
      shell: bash
      env:
        PR_BODY: ${{ inputs.pr_body }}
        JIRA_VERSION: ${{ inputs.jira_version }}
        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        JIRA_USER: ${{ inputs.jira_user_email }}
        JIRA_TOKEN: ${{ inputs.jira_api_token }}
        RELEASE_BLOCKER_FIELD: ${{ inputs.release_blocker_field_id }}
      run: |
        set +e

        ERRORS=""
        DETAILS=""
        OVERALL_PASS=true

        # Resolve Atlassian Cloud ID from site URL (required for scoped API tokens)
        CLOUD_ID=$(curl -s "${JIRA_BASE_URL}/_edge/tenant_info" | jq -r '.cloudId // empty')
        if [ -z "$CLOUD_ID" ]; then
          echo "::error::Could not resolve Atlassian Cloud ID from ${JIRA_BASE_URL}/_edge/tenant_info"
          echo "pass=false" >> "$GITHUB_OUTPUT"
          echo 'errors<<GATE_DELIM' >> "$GITHUB_OUTPUT"
          echo "- **Configuration error**: Could not resolve Atlassian Cloud ID" >> "$GITHUB_OUTPUT"
          echo 'GATE_DELIM' >> "$GITHUB_OUTPUT"
          echo 'details<<GATE_DELIM' >> "$GITHUB_OUTPUT"
          echo 'GATE_DELIM' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        JIRA_API_URL="https://api.atlassian.com/ex/jira/${CLOUD_ID}"

        # Build the regex used to match a fixVersion name. For GA releases we also
        # accept patch/z-stream versions (e.g. "3.5.1 GA RHOAI" for a "3.5" GA branch),
        # which additionally drop the "RELEASE" suffix; everything else must match exactly.
        if [[ "$JIRA_VERSION" =~ ^([0-9]+)\.([0-9]+)\ GA\ RHOAI\ RELEASE$ ]]; then
          JIRA_VERSION_REGEX="^${BASH_REMATCH[1]}\\.${BASH_REMATCH[2]}(\\.[0-9]+)? GA RHOAI( RELEASE)?$"
        else
          # Escape regex metacharacters so the value is matched literally.
          JIRA_VERSION_REGEX="^$(printf '%s' "$JIRA_VERSION" | sed 's/[.[\*^$()+?{|]/\\&/g')$"
        fi

        KEYS=$(echo "$PR_BODY" | grep -oE '(RHOAIENG|RHAIENG|AIPCC)-[0-9]+' | sort -u || true)

        if [ -z "$KEYS" ]; then
          ERRORS="- **No Jira issue found** in PR description. Expected format: \`RHOAIENG-1234\`, \`RHAIENG-1234\`, or \`AIPCC-1234\`"
          OVERALL_PASS=false
        else
          while IFS= read -r KEY; do
            [ -z "$KEY" ] && continue
            ISSUE_ERRORS=""

            TMPFILE=$(mktemp)
            HTTP_CODE=$(curl -s -o "$TMPFILE" -w "%{http_code}" \
              -u "${JIRA_USER}:${JIRA_TOKEN}" \
              -H "Accept: application/json" \
              "${JIRA_API_URL}/rest/api/2/issue/${KEY}?fields=fixVersions,${RELEASE_BLOCKER_FIELD},project")

            if [ "$HTTP_CODE" != "200" ]; then
              ISSUE_ERRORS="  - Could not fetch issue (HTTP ${HTTP_CODE}). Issue may not exist or Jira may be unreachable."
              OVERALL_PASS=false
              ERRORS="${ERRORS}
        - **${KEY}**:
        ${ISSUE_ERRORS}"
              rm -f "$TMPFILE"
              continue
            fi

            PROJECT_KEY=$(jq -r '.fields.project.key // "unknown"' "$TMPFILE")
            if [[ "$PROJECT_KEY" != "RHOAIENG" && "$PROJECT_KEY" != "RHAIENG" && "$PROJECT_KEY" != "AIPCC" ]]; then
              ISSUE_ERRORS="${ISSUE_ERRORS}
          - Project is \`${PROJECT_KEY}\`, expected \`RHOAIENG\`, \`RHAIENG\`, or \`AIPCC\`"
              OVERALL_PASS=false
            fi

            FIX_VERSIONS=$(jq -r '[.fields.fixVersions[]?.name // empty] | join(", ")' "$TMPFILE")
            MATCHED_VERSION=$(jq -r --arg re "$JIRA_VERSION_REGEX" \
              '[.fields.fixVersions[]?.name // empty] | map(select(test($re))) | first // empty' "$TMPFILE")
            if [ -z "$MATCHED_VERSION" ]; then
              ISSUE_ERRORS="${ISSUE_ERRORS}
          - fixVersion does not include \`${JIRA_VERSION}\` (found: ${FIX_VERSIONS:-none})"
              OVERALL_PASS=false
            fi

            BLOCKER_VALUE=$(jq -r --arg f "$RELEASE_BLOCKER_FIELD" \
              '(.fields[$f].value // .fields[$f] // "not set") | tostring' "$TMPFILE" 2>/dev/null || echo "not set")
            if [ "$BLOCKER_VALUE" != "Approved" ]; then
              ISSUE_ERRORS="${ISSUE_ERRORS}
          - Release Blocker is \`${BLOCKER_VALUE}\`, expected \`Approved\`"
              OVERALL_PASS=false
            fi

            if [ -n "$ISSUE_ERRORS" ]; then
              ERRORS="${ERRORS}
        - **${KEY}**:${ISSUE_ERRORS}"
            else
              DETAILS="${DETAILS}
        - **${KEY}**: All checks passed (fixVersion: \`${MATCHED_VERSION}\`)"
            fi

            rm -f "$TMPFILE"
          done <<< "$KEYS"
        fi

        echo "pass=${OVERALL_PASS}" >> "$GITHUB_OUTPUT"

        {
          echo 'errors<<GATE_DELIM'
          echo "$ERRORS"
          echo 'GATE_DELIM'
        } >> "$GITHUB_OUTPUT"

        {
          echo 'details<<GATE_DELIM'
          echo "$DETAILS"
          echo 'GATE_DELIM'
        } >> "$GITHUB_OUTPUT"
